<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星冰樂的運動科學手帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F1FAEE;color:#111111;font-family:"Noto Sans TC",sans-serif}
  header{max-width:1100px;margin:0 auto;padding:64px 24px 8px;display:flex;align-items:flex-end;gap:24px}
  header img{width:90px}
  .tag{color:#E63946;font-weight:700;letter-spacing:4px;font-size:14px}
  h1{font-size:42px;font-weight:900;margin:8px 0 0}
  header p{margin:8px 0 0;color:#5E6670}
  .flow{max-width:1100px;margin:28px auto 0;padding:18px 24px 0;border-top:2px solid #111111;display:flex;gap:14px;align-items:center;font-weight:700;color:#4A4F5A}
  .flow i{font-style:normal;color:#E63946}
  .grid{max-width:1100px;margin:28px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
  .grid a{display:block;color:inherit;text-decoration:none}
  .grid img{width:100%;display:block;box-shadow:0 6px 24px rgba(36,39,46,.10);transition:transform .2s}
  .grid a:hover img{transform:translateY(-4px)}
  .grid div{padding:12px 2px;font-weight:700}
  .grid div span{color:#E63946;margin-right:8px}
  footer{max-width:1100px;margin:0 auto;padding:16px 24px 40px;border-top:1px solid #A8DADC;color:#5E6670;font-size:14px}
  footer a{color:#111111}
</style>
</head>
