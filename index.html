<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星冰樂的運動科學手帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FBF5EA;color:#3B4559;font-family:"Noto Sans TC",sans-serif;
    background-image:linear-gradient(#EDE3D1 1px,transparent 1px),linear-gradient(90deg,#EDE3D1 1px,transparent 1px);background-size:28px 28px}
  header{max-width:1100px;margin:0 auto;padding:48px 24px 8px;display:flex;align-items:center;gap:20px}
  header img{width:110px}
  h1{font-size:40px;font-weight:900;margin:0;background:linear-gradient(transparent 62%,rgba(232,151,63,.38) 62%);display:inline}
  header p{margin:10px 0 0;color:#6B7690}
  .flow{max-width:1100px;margin:22px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700}
  .flow span{background:#fff;border:2px solid #3B4559;border-radius:14px;padding:6px 14px}
  .flow i{font-style:normal;color:#E8973F}
  .grid{max-width:1100px;margin:28px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
  .grid a{display:block;background:#fff;border:2.5px solid #3B4559;border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:4px 5px 0 #D9CBB2;transition:transform .15s}
  .grid a:hover{transform:translateY(-4px) rotate(-.5deg)}
  .grid img{width:100%;display:block}
  .grid div{padding:10px 14px;font-weight:900}
  footer{text-align:center;padding:0 0 40px;color:#8A93A6;font-size:14px}
  footer a{color:#5C8F84}
</style>
</head>
<body>
<header>
  <img src="style/xingbingle.svg" alt="星冰樂">
  <div><h1>星冰樂的運動科學手帳</h1>
  <p>統一風格教學圖卡 Agent｜生成式人工智慧 W12 作業</p></div>
</header>
<div class="flow"><span>📝 notes</span><i>── skill ─▶</i><span>🌐 html</span><i>── skill ─▶</i><span>🖼️ png</span></div>
<div class="grid">
  <a href="png/01-injury-prediction.png"><img src="png/01-injury-prediction.png" alt="傷害預測"><div>No.01 傷害預測</div></a>
  <a href="png/02-training-load.png"><img src="png/02-training-load.png" alt="訓練負荷 ACWR"><div>No.02 訓練負荷 ACWR</div></a>
  <a href="png/03-shap.png"><img src="png/03-shap.png" alt="SHAP 可解釋 AI"><div>No.03 SHAP 可解釋 AI</div></a>
  <a href="png/04-talent-identification.png"><img src="png/04-talent-identification.png" alt="AI 輔助選才"><div>No.04 AI 輔助選才</div></a>
</div>
<footer>內容來源：<a href="https://github.com/Yenchen-H/ai-sport-wiki">AI 在運動科學的應用 LLM Wiki</a>｜<a href="https://github.com/Yenchen-H/xingbingle-sport-cards">GitHub</a></footer>
</body>
</html>
